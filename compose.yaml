name: server-side

services:
  # Webサーバコンテナ
  web:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    ports:
      - target: 80 # コンテナ内のポート（アプリケーションがリッスンするポート）
        published: 8080 # ホストで公開するポート
        protocol: tcp # プロトコルの指定（例: tcp, udp）
        mode: ingress # デフォルトは 'ingress'（bridge モード）
    volumes:
      - type: bind
        source: ./src # ホスト側のソースディレクトリ
        target: /app # コンテナ内のマウントポイント
    container_name: nginx # コンテナ名の指定
    hostname: nginx-host # ホスト名の指定

  # アプリケーションサーバコンテナ
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
      args:
        - UID=1000
        - GID=1000
        - USERNAME=phper
        - GROUPNAME=phper
    container_name: php
    hostname: php-host
    volumes:
      - type: bind # ./srcディレクトリをappのコンテナ内/appにマウント
        source: ./src
        target: /app

    # データベースコンテナ
  db:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: postgres
    platform: linux/amd64
    ports:
      - target: 5432
        published: 5432
        protocol: tcp
        mode: ingress
    volumes:
      - type: volume
        source: db-data
        target: /var/lib/postgresql/data

volumes:
  db-data:
